<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - MyShop</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .success-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .success-box {
            background: white;
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 550px;
            width: 100%;
        }

        .success-icon {
            font-size: 75px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .success-box h1 {
            color: #28a745;
            margin-bottom: 15px;
        }

        .success-box p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .continue-btn {
            display: inline-block;
            background: #ff6b35;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .continue-btn:hover {
            background: #e85a25;
        }
    </style>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <section class="success-container">

        <div class="success-box">

            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1>Order Placed Successfully!</h1>

            <p>
                Thank you for shopping with MyShop.
                Your order has been placed successfully.
                We appreciate your trust in us!
            </p>

            <a href="../index.html" class="continue-btn">
                Continue Shopping
            </a>

        </div>

    </section>

</body>

</html>
